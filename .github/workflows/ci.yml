name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          pytest -q

      - name: Run benchmarks
        id: benchmarks
        run: |
          python benchmarks/run_benchmarks.py --checkpoint benchmarks/checkpoints/official-baseline.json --allow-extra-suites

      - name: Upload benchmark report on failure
        if: failure() && steps.benchmarks.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-py${{ matrix.python-version }}
          path: benchmarks/runs/
          if-no-files-found: warn
          retention-days: 7
