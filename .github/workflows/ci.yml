name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          pytest -q

      - name: Run benchmarks
        id: benchmarks
        run: |
          python benchmarks/run_benchmarks.py --checkpoint benchmarks/checkpoints/official-baseline.json --allow-extra-suites

      - name: Dump benchmark summary on failure
        if: failure() && steps.benchmarks.conclusion == 'failure'
        run: |
          set -e
          latest=$(ls -t benchmarks/runs/*/latest.json | head -1)
          echo "::group::Run summary ($latest)"
          python -c "import json; d=json.load(open('$latest')); print(json.dumps(d['summary'], indent=2))"
          echo "::endgroup::"
          echo "::group::Failed case IDs"
          python -c "import json; d=json.load(open('$latest')); [print(r['id'], '|', r.get('details','')[:160]) for r in d['results'] if not r['passed']]"
          echo "::endgroup::"
