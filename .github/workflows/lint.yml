name: Lint and Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Scan
        run: bandit -r src/guardllm -ll -q

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit
        id: audit
        run: |
          pip-audit --strict --progress-spinner off --format json > /tmp/audit.json 2> /tmp/audit.stderr
          cat /tmp/audit.json
      - name: Publish audit detail on failure
        if: failure() && steps.audit.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let auditJson = '(no audit.json)';
            let stderr = '';
            try { auditJson = fs.readFileSync('/tmp/audit.json', 'utf8'); } catch (e) {}
            try { stderr = fs.readFileSync('/tmp/audit.stderr', 'utf8'); } catch (e) {}
            const text = '### Audit JSON\n```json\n' + auditJson + '\n```\n\n### stderr\n```\n' + stderr + '\n```';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'pip-audit-debug',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'pip-audit failure detail',
                summary: 'See text body',
                text: text.slice(0, 65000)
              }
            });
