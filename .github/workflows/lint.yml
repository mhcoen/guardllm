name: Lint and Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Scan
        run: bandit -r src/guardllm -ll -q

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit
        # pip-audit queries external advisory DBs (OSV, PyPI Safety) and
        # occasionally fails transiently on a 5xx. Retry once before failing.
        run: |
          pip-audit --strict --progress-spinner off || \
            (sleep 15 && pip-audit --strict --progress-spinner off)
