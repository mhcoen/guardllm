name: Lint and Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install -e '.[lint]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install -e '.[lint]'
      - name: Scan
        run: bandit -r src/guardllm -ll -q

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Freeze project dependencies
        run: python -m pip freeze --exclude-editable --exclude guardllm > audit-requirements.txt
      - name: Audit project dependencies
        run: |
          python -m pip install -e '.[audit]'
          pip-audit --strict --progress-spinner off -r audit-requirements.txt || \
            (sleep 15 && pip-audit --strict --progress-spinner off -r audit-requirements.txt)
