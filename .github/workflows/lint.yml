name: Lint and Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install -e '.[lint]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install -e '.[lint]'
      - name: Scan
        run: bandit -r src/vordur -ll -q

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Freeze project dependencies
        run: python -m pip freeze --exclude-editable --exclude vordur > audit-requirements.txt
      - name: Audit project dependencies
        run: |
          python -m pip install -e '.[audit]'
          pip-audit --strict --progress-spinner off -r audit-requirements.txt || \
            (sleep 15 && pip-audit --strict --progress-spinner off -r audit-requirements.txt)

  site:
    name: Built site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Jekyll
        # The same gem GitHub Pages builds with, pinned like every other tool
        # in this workflow so a release cannot turn the build red on its own.
        run: gem install github-pages -v 232 --no-document
      - name: Build the site
        run: github-pages build --destination _site
      - name: Check the built output
        # Source-level assertions cannot see excluded pages, unrendered
        # tables of contents, or missing stylesheet rules. This checks _site.
        run: python scripts/check_built_site.py _site
      - name: Install a browser
        run: |
          python -m pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Check mobile layout at 390px
        # Measured in a real browser. A substring in the stylesheet says
        # nothing about whether a table actually scrolls on a phone.
        run: python scripts/check_mobile_layout.py _site
