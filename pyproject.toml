[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardllm"
version = "0.1.0"
description = "Standalone hardening library for MCP clients/servers and untrusted content"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "guardllm Contributors"}]
dependencies = [
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
