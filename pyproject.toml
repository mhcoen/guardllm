[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardllm"
version = "1.2.0"
description = "Standalone hardening library for MCP clients/servers and untrusted content"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael H. Coen", email = "mhcoen@gmail.com"}]
dependencies = [
  "beautifulsoup4>=4.12",
  # soupsieve is pulled in transitively by beautifulsoup4; pin to the patched
  # release for GHSA-2wc2-fm75-p42x (memory exhaustion, fixed in 2.8.4).
  "soupsieve>=2.8.4",
  "confusables>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
benchmarks = [
  "pyyaml>=6.0",
  "casbin>=1.36",
  "pydantic>=2.0",
  "jsonschema>=4.20",
  "certifi",
]
gpu = [
  "torch>=2.0",
  "transformers>=4.40",
  "huggingface_hub>=0.20",
  "accelerate>=0.25",
]
examples = [
  "torch>=2.0",
  "transformers>=4.40",
  "accelerate>=0.25",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardllm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval_suite: parametrized benchmark eval suite for non-injection control surfaces",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "benchmarks/data",
  "paper",
  ".venv",
  ".venv312",
  "dist",
  "artifacts",
  "local",
  "devel",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "S",     # bandit-like security checks
  "C4",    # comprehensions
  "PIE",   # misc
]
ignore = [
  "E501",  # line length (handled by formatter where possible)
  "S101",  # use of assert is fine in tests
  "S311",  # non-crypto random is fine for benchmark generators
  "B008",  # function-call-in-default is occasionally intentional for dataclass field()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"benchmarks/**" = ["S", "B", "E402", "F841"]
"examples/**" = ["S", "B", "E402", "F841"]
"tutorials/**" = ["S", "B", "E402", "F841"]
"scripts/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
