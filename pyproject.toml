[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardllm"
version = "1.0.3"
description = "Standalone hardening library for MCP clients/servers and untrusted content"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael H. Coen", email = "mhcoen@gmail.com"}]
dependencies = [
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
benchmarks = [
  "pyyaml>=6.0",
  "casbin>=1.36",
  "pydantic>=2.0",
  "jsonschema>=4.20",
  "certifi",
]
gpu = [
  "torch>=2.0",
  "transformers>=4.40",
  "huggingface_hub>=0.20",
  "accelerate>=0.25",
]
examples = [
  "torch>=2.0",
  "transformers>=4.40",
  "accelerate>=0.25",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval_suite: parametrized benchmark eval suite for non-injection control surfaces",
]
